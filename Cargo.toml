[package]
name = "anime-tool"
version = "0.0.0"
edition = "2024"
description = "Local Dandanplay video matching, danmaku download and ASS rendering tool."
license = "MIT"


[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
dirs = "6"
md-5 = "0.10"
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "brotli",
    "deflate",
    "gzip",
    "json",
    "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
suppaftp = "12"
url = "2"
urlencoding = "2.1"


indexmap = "2"
csv = "1"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = { version = "1", features = ["preserve_order"] }
