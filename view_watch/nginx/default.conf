
# view_watch/nginx/default.conf
# 提供同源静态资源和内部 PostgREST 代理.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 16k;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }
    location = /rest/view_watch {
        limit_except GET { deny all; }
        proxy_pass http://watch-rest:3000/view_watch;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /rest/media_file {
        limit_except PATCH { deny all; }
        proxy_pass http://watch-rest:3000/media_file;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /rest/ { return 404; }
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        try_files $uri $uri/ /index.html;
    }
}
